name: Send Daily Report

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  send_daily_report:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Generate Report
      id: report
      run: |
        echo "REPORT_DATE=$(date '+%A, %B %d, %Y')" >> $GITHUB_ENV
        echo "REPORT_TIME=$(date '+%I:%M %p')" >> $GITHUB_ENV
        
        # Count commits today
        COMMITS=$(git log --all --oneline --since="today" | wc -l)
        echo "COMMITS=$COMMITS" >> $GITHUB_ENV
        
        # Count total commits
        TOTAL_COMMITS=$(git log --all --oneline | wc -l)
        echo "TOTAL_COMMITS=$TOTAL_COMMITS" >> $GITHUB_ENV
        
        # Count files
        FILES=$(find . -type f -not -path './.git/*' | wc -l)
        echo "FILES=$FILES" >> $GITHUB_ENV

    - name: Send Daily Report Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.GMAIL_ADDRESS }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        subject: "📊 Daily Report - ${{ env.REPORT_DATE }}"
        to: dania.haj.qassem@gmail.com, ${{ secrets.GMAIL_ADDRESS }}
        from: ${{ secrets.GMAIL_ADDRESS }}
        body: |
          Good Morning! ☀️
          
          Here is your daily automation report:
          
          📅 Date: ${{ env.REPORT_DATE }}
          🕐 Time: ${{ env.REPORT_TIME }}
          
          ═══════════════════════════════════════
          
          📊 REPOSITORY STATISTICS:
          
          ✅ Commits Today: ${{ env.COMMITS }}
          📝 Total Commits: ${{ env.TOTAL_COMMITS }}
          📁 Total Files: ${{ env.FILES }}
          
          ═══════════════════════════════════════
          
          ⭐ ACTIVE WORKFLOWS:
          
          • Hello World (Auto-trigger on push)
          • Send Daily Report (Scheduled - Every 10 AM)
          • Send Test Email (Manual)
          • Send Email to Group (Manual)
          • Send Custom Email (Manual)
          • Create Folder (Manual)
          
          ═══════════════════════════════════════
          
          📋 QUICK LINKS:
          
          • Repository: https://github.com/Ahmadsajjee/atoumation
          • Actions: https://github.com/Ahmadsajjee/atoumation/actions
          • Dashboard: https://ahmadsajjee.github.io/atoumation/
          
          ═══════════════════════════════════════
          
          Have a productive day! 💪
          
          ---
          This report is automatically generated by GitHub Actions
          Sent at 10:00 AM every morning