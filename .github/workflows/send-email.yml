name: Send Email

on:
  workflow_dispatch:
    inputs:
      recipient_email:
        description: 'Recipient email address'
        required: true
        default: 'your-email@example.com'
      email_subject:
        description: 'Email subject'
        required: true
        default: 'Hello from GitHub Actions'
      email_body:
        description: 'Email body/message'
        required: true
        default: 'This is a test email from GitHub Actions'

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
    - name: Send Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.GMAIL_ADDRESS }}
        password: ${{ secrets.GMAIL_APP_PASSWORD }}
        subject: ${{ github.event.inputs.email_subject }}
        to: ${{ github.event.inputs.recipient_email }}
        from: ${{ secrets.GMAIL_ADDRESS }}
        body: |
          ${{ github.event.inputs.email_body }}
          
          ---
          Sent from GitHub Actions - Hello World Automation